name: CI

on:
  push:
    branches: [main, 'agent/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Static security gate
        run: pnpm run security:check

      - name: Enterprise pricing gate
        run: pnpm run pricing:check

      - name: Enterprise 85 gate
        run: pnpm run enterprise:check

      - name: Release hardening gate
        run: pnpm run release:check

      - name: Typecheck
        run: pnpm run typecheck

      - name: Tests
        run: pnpm run test

      - name: Supabase security gate
        run: pnpm run supabase:check

      - name: Production dependency audit
        run: pnpm run audit:prod

      - name: Build
        run: pnpm run build
